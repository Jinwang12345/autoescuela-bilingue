<!-- Vista: Fallos (错题 - Dynamic Failed Questions Loader) -->
<div class="min-h-full w-full max-w-full md:max-w-md mx-auto relative flex flex-col bg-surface">
  <header class="fixed top-0 max-w-full md:max-w-md w-full z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 px-margin flex items-center justify-between">
      <div class="flex items-center gap-space-sm">
        <div class="w-9 h-9 rounded-xl bg-primary-container flex items-center justify-center shadow-[0_2px_8px_rgba(37,99,235,0.25)]">
          <span class="material-symbols-outlined text-white text-[20px]">directions_car</span>
        </div>
        <div class="flex flex-col">
          <h1 class="font-headline-md text-headline-md text-on-surface leading-tight">错题</h1>
          <span class="font-label-sm text-label-sm text-on-surface-variant leading-none">西班牙驾照 · DGT官方题库</span>
        </div>
      </div>
      <div class="flex items-center gap-space-xs">
        <button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high/60 transition-colors text-on-surface-variant">
          <span class="material-symbols-outlined text-[22px]">translate</span>
        </button>
        <a href="#ajustes" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen">
    <div class="flex flex-col w-full px-margin flex flex-col gap-space-md pt-space-sm pb-space-lg">
      
      <!-- Top Bilingual Hero Bar & Statistics -->
      <div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm">
        <div class="flex items-start justify-between gap-space-sm">
          <div class="flex flex-col">
            <div class="flex items-center gap-space-xs">
              <span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">auto_delete</span>
              <h2 class="font-headline-lg text-headline-lg text-on-surface">错题精练本</h2>
            </div>
            <span class="font-body-translation text-body-translation text-on-surface-variant font-medium">Caja de Errores · 针对强化</span>
          </div>
          <!-- Pending badge -->
          <div class="inline-flex flex-col items-end bg-error-container/60 px-2.5 py-1 rounded-lg">
            <div class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-error animate-pulse"></span>
              <span id="failed-count-badge" class="font-label-md text-label-md text-on-error-container font-bold">0 道待复习</span>
            </div>
            <span class="font-label-sm text-[10px] text-on-error-container leading-none" id="failed-count-sub">0 pendientes</span>
          </div>
        </div>
      </div>

      <!-- Clear All Failed Questions Button -->
      <div class="flex justify-end" id="clear-failed-container">
        <button onclick="clearAllFailed()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container hover:bg-rose-100 text-rose-700 transition-colors">
          <span class="material-symbols-outlined text-[16px]">delete_sweep</span>
          <span class="font-label-sm text-label-sm">清空错题本 / Limpiar fallos</span>
        </button>
      </div>

      <!-- MAIN ERROR LIST VIEW -->
      <div class="flex flex-col gap-space-md" id="error-list-view">
        <!-- Dynamic failed question cards injected by initFallosView -->
      </div>

      <!-- ESTADO VACÍO (cuando no hay fallos) -->
      <div id="error-empty-view" class="hidden flex-col items-center justify-center text-center p-space-lg bg-surface-container-lowest rounded-2xl shadow-sm mt-4 min-h-[380px]">
        <div class="relative mb-space-md">
          <div class="w-24 h-24 rounded-full bg-secondary-fixed flex items-center justify-center shadow-lg">
            <span class="material-symbols-outlined text-secondary text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          </div>
          <div class="absolute -top-1 -right-1 w-8 h-8 rounded-full bg-tertiary-fixed flex items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-tertiary text-[18px]">military_tech</span>
          </div>
        </div>
        <h3 class="font-headline-lg text-headline-lg text-on-surface font-bold">太棒了！错题本已全部清空</h3>
        <p class="font-headline-md text-headline-md text-secondary font-semibold mt-1">¡Genial! No tienes fallos acumulados</p>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-[260px] mt-2">
          所有错误题目均已熟练掌握，建议参加全真模拟官方考试。
        </p>
        <div class="mt-space-lg w-full flex flex-col gap-2">
          <a href="#test?id=test_01" class="w-full bg-primary text-on-primary py-3 px-4 rounded-xl font-headline-md text-body-lg font-bold shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[20px]">assignment</span>
            <span>参加全真模拟考试 · Test General</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 max-w-full md:max-w-md w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(15,23,42,0.05)]">
    <div class="flex items-center justify-around h-16 px-space-xs">
      <a href="#inicio" data-path="inicio" class="flex flex-col items-center justify-center min-w-[64px] h-12 gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <div class="flex items-center gap-0.5">
          <span class="font-label-sm text-label-sm leading-none">首页</span>
        </div>
      </a>
      <a href="#temario" data-path="temario" class="flex flex-col items-center justify-center min-w-[64px] h-12 gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined text-[24px]">menu_book</span>
        <div class="flex items-center gap-0.5">
          <span class="font-label-sm text-label-sm leading-none">专题</span>
        </div>
      </a>
      <a href="#fallos" data-path="fallos" aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] h-12 gap-0.5 transition-colors text-primary font-bold">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">error</span>
        <div class="flex items-center gap-0.5">
          <span class="font-label-sm text-label-sm leading-none">错题</span>
        </div>
      </a>
      <a href="#ajustes" data-path="ajustes" class="flex flex-col items-center justify-center min-w-[64px] h-12 gap-0.5 text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined text-[24px]">settings</span>
        <div class="flex items-center gap-0.5">
          <span class="font-label-sm text-label-sm leading-none">设置</span>
        </div>
      </a>
    </div>
  </nav>
</div>

<script>
  (function initFallosView() {
    renderFailedQuestions();
  })();

  function renderFailedQuestions() {
    const failedList = window.AppDB.getFailedQuestions();
    const badge = document.getElementById('failed-count-badge');
    const badgeSub = document.getElementById('failed-count-sub');
    const listView = document.getElementById('error-list-view');
    const emptyView = document.getElementById('error-empty-view');
    const clearBtnContainer = document.getElementById('clear-failed-container');

    if (badge) badge.textContent = `${failedList.length} 道待复习`;
    if (badgeSub) badgeSub.textContent = `${failedList.length} pendientes`;

    if (failedList.length === 0) {
      if (listView) listView.classList.add('hidden');
      if (emptyView) {
        emptyView.classList.remove('hidden');
        emptyView.classList.add('flex');
      }
      if (clearBtnContainer) clearBtnContainer.classList.add('hidden');
      return;
    }

    if (emptyView) emptyView.classList.add('hidden');
    if (clearBtnContainer) clearBtnContainer.classList.remove('hidden');
    if (listView) {
      listView.classList.remove('hidden');
      listView.innerHTML = '';

      failedList.forEach((q, idx) => {
        const correctOpt = q.opciones.find(o => o.es_correcta);
        const card = document.createElement('article');
        card.className = 'bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm relative transition-all';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 bg-surface-container px-2 py-0.5 rounded-md">
              <span class="material-symbols-outlined text-primary text-[14px]">school</span>
              <span class="font-label-sm text-label-sm text-on-surface font-semibold">${q.tema ? q.tema.replace(/_/g, ' ') : 'General'}</span>
            </div>
            <button onclick="removeSingleFailed('${q.id}')" class="text-on-surface-variant hover:text-rose-600 p-1">
              <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
          </div>
          <div class="flex flex-col gap-1 mt-1">
            <p class="font-headline-md text-headline-md text-on-surface font-semibold">${q.pregunta ? q.pregunta.zh_completa : ''}</p>
            <p class="font-body-translation text-body-translation text-on-surface-variant">${q.pregunta ? q.pregunta.es_completa : ''}</p>
          </div>
          ${q.imagen_url ? `
            <div class="w-full h-32 rounded-lg overflow-hidden relative mt-1 bg-surface-container">
              <img class="w-full h-full object-cover" src="${q.imagen_url}" alt="DGT Question image" />
            </div>
          ` : ''}
          <div class="flex flex-col gap-2 pt-1">
            <div class="bg-secondary-container/40 rounded-lg p-2.5 flex items-start gap-2.5">
              <div class="w-5 h-5 rounded-full bg-secondary text-on-secondary flex items-center justify-center shrink-0 mt-0.5 font-bold text-xs">
                ${correctOpt ? correctOpt.id : '✓'}
              </div>
              <div class="flex flex-col">
                <span class="font-label-sm text-[11px] text-on-secondary-container font-semibold uppercase tracking-wider">正确答案 · Respuesta correcta:</span>
                <span class="font-body-md text-body-md text-on-secondary-container font-semibold">${correctOpt ? correctOpt.zh_completa : ''}</span>
                <span class="font-body-translation text-body-translation text-on-secondary-container/90">${correctOpt ? correctOpt.es_completa : ''}</span>
              </div>
            </div>
          </div>
        `;
        listView.appendChild(card);
      });
    }
  }

  function removeSingleFailed(questionId) {
    window.AppDB.removeFailedQuestion(questionId);
    renderFailedQuestions();
  }

  function clearAllFailed() {
    if (confirm('确认清空所有错题记录吗？\n¿Vaciar lista de fallos?')) {
      window.AppDB.clearFailedQuestions();
      renderFailedQuestions();
    }
  }
</script>
