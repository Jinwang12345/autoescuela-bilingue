  <!-- Custom Global CSS -->
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0f172a;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* Estilos para interactividad de palabras y tooltips */
    .word-interactive {
      position: relative;
      display: inline-block;
      text-decoration-line: underline;
      text-decoration-style: dashed;
      text-decoration-color: #3b82f6;
      text-underline-offset: 4px;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.15s ease;
      touch-action: manipulation;
    }
    .word-interactive:active, .word-interactive.active-tap {
      background-color: #dbeafe;
    }
    .interactive-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      white-space: nowrap;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25), 0 8px 10px -6px rgba(15, 23, 42, 0.2);
    }
    .interactive-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
    }
    .word-interactive.show-tooltip .interactive-tooltip {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .image-zoom-overlay {
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .image-zoom-overlay.open {
      opacity: 1;
      visibility: visible;
    }
  </style>
