<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autoescuela Bilingüe - Test DGT</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans text-slate-800 selection:bg-blue-500 selection:text-white">

  <!-- Mobile Viewport Shell (Max-Width 420px) -->
  <div class="w-full max-w-[420px] h-screen sm:h-[840px] bg-slate-50 sm:rounded-3xl shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-8 sm:border-slate-800">
    
    <!-- Top Header Bar (Mobile Status/App Bar) -->
    <header class="bg-slate-900 text-white py-3 px-4 flex items-center justify-between shadow-md z-10 shrink-0">
      <div class="flex items-center space-x-2">
        <i data-lucide="car" class="w-6 h-6 text-blue-400"></i>
        <h1 class="text-base font-bold tracking-wide text-slate-100">Autoescuela DGT</h1>
      </div>
      <span class="text-xs bg-blue-600/30 text-blue-300 font-semibold px-2 py-0.5 rounded-full border border-blue-500/30">ES / ZH</span>
    </header>

    <!-- Main View Container (Dynamic SPA View Injection) -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-20 scroll-smooth">
      <!-- Dynamic view content loaded by app.js -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center py-2 px-2 shadow-lg z-20">
      <a href="#inicio" data-nav="inicio" class="nav-btn flex flex-col items-center justify-center text-slate-500 hover:text-blue-600 transition-colors py-1 px-2 rounded-lg text-xs font-medium">
        <i data-lucide="home" class="w-5 h-5 mb-1"></i>
        <span>Inicio</span>
      </a>
      <a href="#temario" data-nav="temario" class="nav-btn flex flex-col items-center justify-center text-slate-500 hover:text-blue-600 transition-colors py-1 px-2 rounded-lg text-xs font-medium">
        <i data-lucide="book-open" class="w-5 h-5 mb-1"></i>
        <span>Temario</span>
      </a>
      <a href="#test" data-nav="test" class="nav-btn flex flex-col items-center justify-center text-slate-500 hover:text-blue-600 transition-colors py-1 px-2 rounded-lg text-xs font-medium">
        <i data-lucide="file-text" class="w-5 h-5 mb-1"></i>
        <span>Test</span>
      </a>
      <a href="#fallos" data-nav="fallos" class="nav-btn flex flex-col items-center justify-center text-slate-500 hover:text-blue-600 transition-colors py-1 px-2 rounded-lg text-xs font-medium">
        <i data-lucide="alert-triangle" class="w-5 h-5 mb-1"></i>
        <span>Fallos</span>
      </a>
      <a href="#ajustes" data-nav="ajustes" class="nav-btn flex flex-col items-center justify-center text-slate-500 hover:text-blue-600 transition-colors py-1 px-2 rounded-lg text-xs font-medium">
        <i data-lucide="settings" class="w-5 h-5 mb-1"></i>
        <span>Ajustes</span>
      </a>
    </nav>

  </div>

  <!-- App Router & Controller -->
  <script src="js/app.js"></script>
</body>
</html>
